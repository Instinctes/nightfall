[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# getrandom 0.3/0.4 on wasm32 need an explicit JS backend. Without this,
# `rand` / `curve25519-dalek` fail at compile time for the browser wallet.
# Keep the wasm stack modest (2 MiB). A 16 MiB stack plus the heap OOMs
# iOS Safari and shows up as the same "Unreachable" trap as a panic.
# SIMD is off: some iOS WebKit builds trap mid-dalek, not at instantiate.
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg",
    "getrandom_backend=\"wasm_js\"",
    "-C",
    "link-arg=-zstack-size=2097152",
    "-C",
    "target-feature=-simd128",
]
