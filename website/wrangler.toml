# NIGHTFALLCOIN website — Cloudflare Worker with static assets.
#
#   wrangler deploy          publish
#   wrangler dev             run locally on http://localhost:8787
#
# The Worker exists to attach strict security headers; the site itself is
# static. See src/index.js for why that matters on a page that serves wallet
# binaries.

name = "nightfallcoin"
main = "src/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "./public"
binding = "ASSETS"
# A real 404, not an SPA fallback. This site has no client-side routing, and
# returning 200 with HTML for a missing path means a broken download link
# quietly saves a web page as a .dmg instead of failing loudly.
not_found_handling = "404-page"
# Without this, Cloudflare serves static files straight from the edge and the
# Worker never executes — which silently drops every security header. The
# whole reason this is a Worker and not plain Pages is those headers, so the
# request has to reach the script first.
run_worker_first = true

[observability]
enabled = true
