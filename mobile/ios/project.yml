name: NightfallWallet
options:
  bundleIdPrefix: org.nightfallcoin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.nightfallcoin.wallet
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    OTHER_LDFLAGS: ["-lc++"]
    HEADER_SEARCH_PATHS: ["$(SRCROOT)/NightfallWallet/Generated"]
    LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/Libs"]
    SWIFT_OBJC_BRIDGING_HEADER: NightfallWallet/BridgingHeader.h
    INFOPLIST_FILE: NightfallWallet/Info.plist
    GENERATE_INFOPLIST_FILE: false
targets:
  NightfallWallet:
    type: application
    platform: iOS
    sources:
      - NightfallWallet
    settings:
      base:
        PRODUCT_NAME: NIGHT
    info:
      path: NightfallWallet/Info.plist
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - framework: Libs/libnightfall_mobile.a
        embed: false
