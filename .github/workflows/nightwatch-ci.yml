name: Nightwatch offline regression

on:
  pull_request:
    paths:
      - 'scripts/nightwatch.py'
      - 'scripts/nightwatch_upgrade_gate.py'
      - 'scripts/test_nightwatch*.py'
      - '.github/workflows/nightwatch-ci.yml'

  push:
    paths:
      - 'scripts/nightwatch.py'
      - 'scripts/nightwatch_upgrade_gate.py'
      - 'scripts/test_nightwatch*.py'
      - '.github/workflows/nightwatch-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nightwatch regression suite
        run: |
          python3 -m unittest discover -s scripts -p 'test_nightwatch*.py' -v
