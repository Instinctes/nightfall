name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The desktop wallet needs system libraries for windowing and GL.
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Formatting
        run: cargo fmt --all --check

      # Clippy must be clean, not "mostly clean". Dead code and unused
      # constants are how unreadable UI and stale helpers slipped through.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Three UI bugs shipped on 26 Aug 2026 because a selector was written for
      # markup that does not exist. A human found all three by squinting at a
      # phone; this finds them in a second. See scripts/check-web-wallet.mjs.
      - name: Browser wallet, static checks
        run: node scripts/check-web-wallet.mjs

      # Same class of bug, same one-second check, for the chain view: an id the
      # script reaches for that the page never renders, a class with no rule,
      # an inline script the CSP will block, a missing Worker route.
      - name: Chain page, static checks
        run: node scripts/check-chain-page.mjs

      # The 0.8.3 bump updated every .html and left js/main.js pointing at
      # 0.8.2 files that had just been deleted — the "recommended for your
      # device" button was a 404 and a person found it in a screenshot. This
      # compares the links against the directory listing, both directions.
      - name: Download links, static checks
        run: node scripts/check-download-links.mjs

      # The whole point of the project. Every test in this suite is the
      # inverse of an exploit that once worked against a real build.
      - name: Exploit regression suite
        run: cargo test -p nightfall-ledger --test exploit_regression -- --nocapture

      # Persistence must survive a reorg — this was found by running two
      # miners against each other, not by a unit test.
      - name: Reorg persistence
        run: cargo test -p nightfall-storage --test reorg_persistence

  build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build release binaries
        run: cargo build --release -p nightfall-node -p nightfall-wallet -p nightfall-core
