name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The desktop wallet needs system libraries for windowing and GL.
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Formatting
        run: cargo fmt --all --check

      # Clippy must be clean, not "mostly clean". Dead code and unused
      # constants are how unreadable UI and stale helpers slipped through.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The website checks used to sit here — browser wallet, chain page,
      # download links, cache busters, button colours — and the archive
      # retirement self-test with them. They are gone from this file, not from
      # the project.
      #
      # The site left this repository on 8 September 2026, so every one of them
      # reads files that will never exist here again; they did not weaken, they
      # simply had nothing left to look at, and the first run after the move
      # failed on exactly that. They now run in `scripts/deploy-website.sh`,
      # which is the gate the site actually passes through, and they run there
      # before every publication rather than on every commit.
      #
      # The archive self-test had the same problem — its script is
      # workspace-only — and now runs inside the weekly archive script itself,
      # on every real run, before anything is uploaded or deleted. A check that
      # guards a deletion belongs next to the deletion.
      #
      # Documentation versions stays: it reads docs/ and README.md, both here.
      - name: Documentation versions, static checks
        run: node scripts/check-docs-version.mjs

      # The whole point of the project. Every test in this suite is the
      # inverse of an exploit that once worked against a real build.
      - name: Exploit regression suite
        run: cargo test -p nightfall-ledger --test exploit_regression -- --nocapture

      # Persistence must survive a reorg — this was found by running two
      # miners against each other, not by a unit test.
      - name: Reorg persistence
        run: cargo test -p nightfall-storage --test reorg_persistence

  build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build release binaries
        run: cargo build --release -p nightfall-node -p nightfall-wallet -p nightfall-core

      # A build proves the code compiles for this platform. It proves nothing
      # about whether the wallet's storage rules hold there — and until this
      # step existed, nothing did: the workspace test run above is Linux-only,
      # and the encrypted-storage suite was gated to Unix, so Windows had no
      # test coverage of the adapter at all. These are the ordering,
      # verification and crash-injection cases; the ones that need symlinks or
      # Unix permission bits are marked `#[cfg(unix)]` in the source and are
      # skipped here by the compiler rather than silently at runtime.
      - name: Wallet storage tests
        run: cargo test -p nightfall-wallet --lib
