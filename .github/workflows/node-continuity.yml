name: Nightfall Node Continuity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/node_continuity.py'
      - 'scripts/test_node_continuity.py'
      - 'docs/NODE-CONTINUITY.md'
      - '.github/workflows/node-continuity.yml'

  pull_request:
    paths:
      - 'scripts/node_continuity.py'
      - 'scripts/test_node_continuity.py'
      - 'docs/NODE-CONTINUITY.md'
      - '.github/workflows/node-continuity.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify continuity guard
        run: |
          python3 -m unittest discover -s scripts -p 'test_node_continuity.py' -v
