name: Research PR28 - cut-through review

on:
  push:
    branches:
      - feat/cutthrough-spend-auth-v1
  pull_request:
    paths:
      - 'crates/nightfall-ledger/**'
      - 'crates/nightfall-storage/**'
      - 'docs/REVIEW-EVIDENCE-PR28.md'
      - '.github/workflows/research-pr28-review.yml'
      - 'scripts/research-protocol-guard.py'

permissions:
  contents: read

jobs:
  test-research-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Verify mainnet identity
        run: python3 scripts/research-protocol-guard.py

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Ledger and storage tests
        run: cargo test --locked -p nightfall-ledger -p nightfall-storage

      - name: Strict Clippy
        run: cargo clippy --locked -p nightfall-ledger -p nightfall-storage --all-targets -- -D warnings

      - name: Node integration compile
        run: cargo check --locked -p nightfall-node
