name: Public network health offline regression

on:
  push:
    paths:
      - 'scripts/public_network_health.py'
      - 'scripts/test_public_network_health.py'
      - 'docs/PUBLIC-NETWORK-HEALTH.md'
      - '.github/workflows/public-network-health.yml'

  pull_request:
    paths:
      - 'scripts/public_network_health.py'
      - 'scripts/test_public_network_health.py'
      - 'docs/PUBLIC-NETWORK-HEALTH.md'
      - '.github/workflows/public-network-health.yml'

jobs:
  offline-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Adversarial regression tests
        run: |
          python3 scripts/test_public_network_health.py

      - name: Compile Python source
        run: |
          python3 -m py_compile scripts/public_network_health.py scripts/test_public_network_health.py
