[package]
name = "nightfall-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NIGHTFALLCOIN Core Wallet — mine, send, receive (desktop GUI)"

[[bin]]
name = "nightfall-core"
path = "src/main.rs"

[dependencies]
nightfall-types = { workspace = true }
nightfall-crypto = { workspace = true }
nightfall-ledger = { workspace = true }
nightfall-consensus = { workspace = true }
nightfall-storage = { workspace = true }
nightfall-node = { path = "../nightfall-node" }
nightfall-p2p = { workspace = true }
nightfall-wallet = { path = "../nightfall-wallet" }
nightfall-swap = { path = "../nightfall-swap" }
# Only to parse the Bitcoin addresses the user types; this wallet holds NIGHT.
bitcoin = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
arboard = "3"
qrcode = { version = "0.14.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ureq = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"
