[package]
name = "nightfall-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cryptography for NIGHTFALLCOIN"

[dependencies]
nightfall-types = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
curve25519-dalek = { workspace = true }
argon2 = { workspace = true }
bulletproofs = { workspace = true }
merlin = { workspace = true }
serde = { workspace = true }
subtle = { workspace = true }
bip39 = { workspace = true }
sha2 = { workspace = true }
rand_chacha = { workspace = true }
generic-array = { workspace = true }
digest = { workspace = true }
sigma_fun = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# bulletproofs → merlin → clear_on_drop tries to compile C by default.
# There is no clang wasm target here; the crate has a pure-Rust fallback.
clear_on_drop = { version = "0.2", features = ["no_cc"] }
