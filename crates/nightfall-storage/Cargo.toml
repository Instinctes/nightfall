[package]
name = "nightfall-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Filesystem chain + wallet storage"

[dependencies]
nightfall-types = { workspace = true }
nightfall-consensus = { workspace = true }
nightfall-ledger = { workspace = true }
nightfall-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }

# One writer per data directory. The lock is held by the OS so that a crash
# frees it; see src/dirlock.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
nightfall-crypto = { workspace = true }
