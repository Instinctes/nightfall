[package]
name = "nightfall-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NIGHTFALLCOIN CLI wallet"

[lib]
name = "nightfall_wallet"
path = "src/lib.rs"

[[bin]]
name = "nightfall-wallet"
path = "src/main.rs"

[dependencies]
nightfall-types = { workspace = true }
nightfall-crypto = { workspace = true }
nightfall-ledger = { workspace = true }
nightfall-consensus = { workspace = true }
nightfall-storage = { workspace = true }
curve25519-dalek = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
argon2 = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The vault adapter's Windows filesystem primitives: the hard-link count of an
# open handle, and a rename that asks to be written through. See src/vault_fs.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
