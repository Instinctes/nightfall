[package]
name = "nightfall-gpu"
description = "GPU backend (Metal / CUDA) for Nighthash-v2 mining. Off until the user switches it on."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nightfall-types = { workspace = true }
nightfall-crypto = { workspace = true }
blake2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = "0.8"

[[example]]
name = "gpubench"
